<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XWorkDesk 远程桌面</title>
</head>

<body>
    <div id="app">
        <!-- 登录界面 -->
        <div id="login-screen" class="screen active">
            <div class="login-wrap">
                <div class="avatar">
                    <svg viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
                    </svg>
                </div>
                <!-- 标准 username/password 字段名：让浏览器识别为登录表单
                     （原生保存密码提示依赖）；提交由 JS preventDefault 接管，
                     走 WebSocket 登录，不产生真实页面跳转 -->
                <form id="login-form" novalidate>
                    <div class="field">
                        <input id="xwd-account" name="username" type="text" placeholder="输入用户名" autocomplete="username"
                            spellcheck="false" aria-label="用户名" required />
                    </div>
                    <div class="field">
                        <input id="xwd-pass" name="password" type="password" placeholder="输入密码"
                            autocomplete="current-password" aria-label="密码" required />
                    </div>
                    <button id="login-btn" type="submit">
                        <span class="btn-label">登录</span>
                        <span class="spinner" hidden></span>
                    </button>
                </form>
                <div id="login-error" class="login-error" hidden></div>
            </div>
            <!-- 右下角设置按钮 + 配置面板 -->
            <button id="settings-btn" class="settings-btn" aria-label="设置" title="设置">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
            <div id="settings-panel" class="settings-panel" hidden>
                <div class="settings-title">设置</div>
                <label class="setting-row">
                    <span>显示调试信息</span>
                    <input type="checkbox" id="set-debug" />
                </label>
                <label class="setting-row">
                    <span>静态帧优化</span>
                    <input type="checkbox" id="set-static" />
                </label>
                <label class="setting-row">
                    <span>桌面动画</span>
                    <input type="checkbox" id="set-anim" />
                </label>
                <label class="setting-row">
                    <span>启用音频传输</span>
                    <input type="checkbox" id="set-audio" />
                </label>
                <label class="setting-row">
                    <span>共享剪贴板</span>
                    <input type="checkbox" id="set-clipboard" />
                </label>
                <label class="setting-row">
                    <span>码率</span>
                    <select id="set-bitrate">
                        <option value="0">自动</option>
                        <option value="1000">1 Mbps</option>
                        <option value="2000">2 Mbps</option>
                        <option value="4000">4 Mbps</option>
                        <option value="8000">8 Mbps</option>
                        <option value="16000">16 Mbps</option>
                    </select>
                </label>
                <label class="setting-row" id="row-quality">
                    <span>码率质量</span>
                    <select id="set-quality">
                        <option value="28">最差</option>
                        <option value="25">较低</option>
                        <option value="23">默认</option>
                        <option value="18">较高</option>
                        <option value="0">无损</option>
                    </select>
                </label>
                <label class="setting-row">
                    <span>最大帧率</span>
                    <select id="set-fps">
                        <option value="15">15 FPS</option>
                        <option value="30">30 FPS</option>
                        <option value="60">60 FPS</option>
                    </select>
                </label>
                <label class="setting-row">
                    <span>屏幕分辨率</span>
                    <select id="set-res">
                        <option value="auto">自动(点对点)</option>
                        <option value="3840x2160">4K (16:9)</option>
                        <option value="2560x1440">2K (16:9)</option>
                        <option value="1920x1080">1080P (16:9)</option>
                        <option value="1280x720">720P (16:9)</option>
                    </select>
                </label>
                <label class="setting-row">
                    <span>屏幕比例</span>
                    <select id="set-ratio">
                        <option value="fit">适应</option>
                        <option value="stretch">拉伸</option>
                        <option value="pixel">点对点</option>
                    </select>
                </label>
            </div>
        </div>

        <!-- 桌面界面 -->
        <div id="desk-screen" class="screen">
            <div class="desk-stage">
                <canvas id="screen" width="1280" height="720"></canvas>
                <!-- 左上角调试信息（开发阶段） -->
                <div id="debug-hud">
                    <span id="dbg-res"></span>
                    <span id="dbg-fps"></span>
                    <span id="dbg-lat"></span>
                    <span id="dbg-bw"></span>
                    <span id="dbg-dec"></span>
                    <a id="disconnect-btn" href="#">断开连接</a>
                </div>
                <div id="connecting-overlay" class="connecting-overlay">
                    <div class="spinner big"></div>
                    <p>正在建立桌面会话…</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
