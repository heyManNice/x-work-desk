<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XWorkDesk 远程桌面</title>
</head>

<body>
    <div id="app">
        <!-- 登录界面（仿登录管理器） -->
        <div id="login-screen" class="screen active">
            <div class="login-bg">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
                <div class="grid-overlay"></div>
            </div>
            <div class="login-card">
                <div class="avatar">
                    <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
                        <path
                            d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-3.9 0-7 2.02-7 4.5V20h14v-1.5c0-2.48-3.1-4.5-7-4.5Z" />
                    </svg>
                </div>
                <h1 class="brand">XWorkDesk</h1>
                <p class="subtitle">登录以访问您的桌面</p>
                <!-- autocomplete=off + 唯一字段名：避免浏览器弹出"推荐账号"等自动填充建议 -->
                <form id="login-form" autocomplete="off" novalidate>
                    <div class="field">
                        <label for="xwd-account">用户名</label>
                        <input id="xwd-account" name="xwd-account" type="text" placeholder="输入用户名" autocomplete="off"
                            spellcheck="false" required />
                    </div>
                    <div class="field">
                        <label for="xwd-pass">密码</label>
                        <input id="xwd-pass" name="xwd-pass" type="password" placeholder="输入密码"
                            autocomplete="current-password" required />
                    </div>
                    <div id="login-error" class="login-error" hidden></div>
                    <button id="login-btn" type="submit">
                        <span class="btn-label">登录</span>
                        <span class="spinner" hidden></span>
                    </button>
                    <p class="hint">连接状态：<span id="conn-status" class="conn-dot">未连接</span></p>
                </form>
            </div>
        </div>

        <!-- 桌面界面 -->
        <div id="desk-screen" class="screen">
            <div class="desk-stage">
                <canvas id="screen" width="1280" height="720"></canvas>
                <!-- 左上角调试信息（开发阶段） -->
                <div id="debug-hud">
                    <span id="dbg-res"></span>
                    <span id="dbg-fps"></span>
                    <span id="dbg-lat"></span>
                    <a id="disconnect-btn" href="#">断开</a>
                </div>
                <div id="connecting-overlay" class="connecting-overlay">
                    <div class="spinner big"></div>
                    <p>正在建立桌面会话…</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
