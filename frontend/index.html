<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XWorkDesk</title>
</head>

<body>
    <!-- Solid 应用根：标题栏 / 侧栏 / 标签 / 会话视图 / 主机编辑 全部由组件渲染 -->
    <div id="app-root"></div>

    <!-- 命令式全局层（由 modal.ts / transfer.ts 操作，非 Solid 组件） -->
    <div id="modal-mask" class="modal-layer">
        <div class="modal-panel modal-small" role="dialog" aria-modal="true">
            <div class="mp-head"><span class="mp-title" id="modal-title">提示</span></div>
            <div class="mp-body">
                <div id="modal-text" class="modal-text"></div>
            </div>
            <div class="mp-foot">
                <span class="mp-spacer"></span>
                <button id="modal-cancel" class="btn">取消</button>
                <button id="modal-ok" class="btn primary">确定</button>
            </div>
        </div>
    </div>
    <div id="transfer-toast" class="transfer-toast" hidden></div>

    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
