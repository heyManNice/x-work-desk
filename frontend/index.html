<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XWorkDesk 远程桌面</title>
</head>

<body>
    <div id="app">
        <!-- 登录界面 -->
        <div id="login-screen" class="screen active">
            <div class="login-wrap">
                <div class="avatar">
                    <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
                    </svg>
                </div>
                <!-- autocomplete=off + 唯一字段名：避免浏览器弹出"推荐账号"等自动填充建议 -->
                <form id="login-form" autocomplete="off" novalidate>
                    <div class="field">
                        <input id="xwd-account" name="xwd-account" type="text" placeholder="输入用户名" autocomplete="off"
                            spellcheck="false" aria-label="用户名" required />
                    </div>
                    <div class="field">
                        <input id="xwd-pass" name="xwd-pass" type="password" placeholder="输入密码"
                            autocomplete="current-password" aria-label="密码" required />
                    </div>
                    <div id="login-error" class="login-error" hidden></div>
                    <button id="login-btn" type="submit">
                        <span class="btn-label">登录</span>
                        <span class="spinner" hidden></span>
                    </button>
                </form>
            </div>
        </div>

        <!-- 桌面界面 -->
        <div id="desk-screen" class="screen">
            <div class="desk-stage">
                <canvas id="screen" width="1280" height="720"></canvas>
                <!-- 左上角调试信息（开发阶段） -->
                <div id="debug-hud">
                    <span id="dbg-res"></span>
                    <span id="dbg-fps"></span>
                    <span id="dbg-lat"></span>
                    <a id="disconnect-btn" href="#">断开</a>
                </div>
                <div id="connecting-overlay" class="connecting-overlay">
                    <div class="spinner big"></div>
                    <p>正在建立桌面会话…</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
