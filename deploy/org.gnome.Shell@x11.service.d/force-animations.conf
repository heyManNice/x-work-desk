# XWorkDesk: Xvfb 软件渲染下强制允许 GNOME 桌面动画
#
# GNOME Shell 48+ 检测到渲染器非硬件加速（llvmpipe/softpipe）时会在
# AnimationsSettings 里 inhibit 动画，导致前端"桌面动画"开关写的
# org.gnome.desktop.interface enable-animations 不生效。
# 本覆盖给 gnome-shell 加 --force-animations，跳过该检查；
# 实际开/关仍由前端开关（gsettings）控制，默认保持关闭。
#
# 若不需要此能力（实体机硬件渲染本就不受影响），删除本文件后执行：
#   systemctl --user daemon-reload   （对每个在线用户）
[Service]
ExecStart=
ExecStart=/usr/bin/gnome-shell --force-animations
