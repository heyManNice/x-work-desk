# XWorkDesk: 虚拟机内禁用 PCI 音频硬件节点
#
# VMware 等虚拟机模拟的 PCI 声卡（ES1371/ENS1371 等）在 PipeWire 下时序
# 不稳定，表现为持续 xrun/resync、sink 输出全零，导致桌面音频采集静音。
# 这里把 VM 环境（存在 cpu.vm.name 属性）中的 ALSA PCI 输出/输入节点禁用，
# 会话自动回退到 Dummy Output（auto_null 软件 sink），桌面音频经其 monitor
# 端口稳定采集并推流；浏览器端负责播放，虚拟机本地无需出声。
#
# 实体机没有 cpu.vm.name 属性，此规则不匹配，真实声卡不受影响。
# 不需要此行为时删除本文件并重启各用户的 wireplumber 即可。
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.pci.*"
        cpu.vm.name = "~.*"
      }
      {
        node.name = "~alsa_input.pci.*"
        cpu.vm.name = "~.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = "true"
      }
    }
  }
]
