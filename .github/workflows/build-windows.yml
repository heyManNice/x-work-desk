name: Build Windows

on:
  # 手动触发：Actions 页 → Run workflow
  workflow_dispatch:
  # 打标签 v* 时自动触发
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 依赖与编译产物：第一次全量编译，之后命中可跳过下载/重编译
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Tauri v2 前端在 frontend/，src-tauri 在 frontend/src-tauri
      # beforeBuildCommand 会先执行 npm run build（vite）
      - name: Build & bundle (Tauri, Windows)
        working-directory: frontend
        run: npm run tauri build
        env:
          # 未配置签名密钥时不签名（发布时再配）
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XWorkDesk-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
