name: Build Windows MSI

# 仅手动触发（开发过程中的提交不自动构建；需要出包时在 Actions 手动 Run workflow）
on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package MSI (electron-builder)
        run: npx electron-builder --win msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: XWorkDesk-windows
          path: frontend/release/*.msi
          if-no-files-found: error
